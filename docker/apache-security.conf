# Hardening for the public site (defence in depth: secrets are not in the image anyway).

# Do not advertise the server software or version.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Refuse hidden files (.env, .git, .htaccess …) anywhere, except Let's Encrypt challenges.
<LocationMatch "/\.(?!well-known)">
    Require all denied
</LocationMatch>

# Refuse config, source, backup and log files even if one ends up in public/.
<FilesMatch "(?i)\.(env|ini|log|sh|sql|bak|old|swp|dist|lock|ya?ml|md|git.*)$|^(composer\.(json|lock)|package(-lock)?\.json|artisan|server\.php)$">
    Require all denied
</FilesMatch>

# Browser security headers.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always unset X-Powered-By
</IfModule>
