# /etc/nginx/sites-available/lav-sms-8443  (symlink into sites-enabled)
# LAV SMS at https://dev.lefsignature.com:8443, next to the existing dev app on 443.
# Re-uses the dev.lefsignature.com Certbot certificate: a certificate covers the host
# name on every port, so no new DNS record or certificate is needed.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name dev.lefsignature.com;

    ssl_certificate /etc/letsencrypt/live/dev.lefsignature.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.lefsignature.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Block hidden files such as .env and .git
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    # Block common WordPress/bot probes
    location ~* ^/(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php) {
        return 404;
    }

    # Plain http on this port: send to https
    error_page 497 =301 https://$host:8443$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
