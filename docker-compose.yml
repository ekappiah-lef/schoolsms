# Test deployment of LAV SMS.
#   docker compose up -d --build
# By default the app listens on 127.0.0.1:8081 only, for the host's nginx to publish on
# https://dev.lefsignature.com:8443. On a stand-alone test instance set APP_BIND=80 in a
# file named .env next to this file. See docs/DEPLOY.md.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: lav-sms:latest
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      - db
    ports:
      # Behind the server's nginx (default): 127.0.0.1:8081. On its own test instance: APP_BIND=80
      - "${APP_BIND:-127.0.0.1:8081}:80"
    volumes:
      - uploads:/var/www/html/storage/app/public
      - logs:/var/www/html/storage/logs
      - ./docker/seed:/docker/seed:ro

  db:
    image: mariadb:10.6
    restart: unless-stopped
    env_file: .env.docker   # MARIADB_* variables
    volumes:
      - dbdata:/var/lib/mysql

  # HTTPS for a stand-alone server (needed for the webcam "Take photo" and MoMo callbacks).
  # Enable with COMPOSE_PROFILES=https and DOMAIN=98-81-86-52.sslip.io in the compose .env file.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  dbdata:
  uploads:
  logs:
